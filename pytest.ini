[pytest]
# The application modules (engine.py, models.py, data_loader.py, pipelines/)
# live at the repo root while the tests live in tests/, so the root has to be
# on sys.path for `from engine import ...` to resolve during collection.
#
# This is load-bearing: with it removed, a bare `pytest` fails to import all
# 18 test files. `python -m pytest` appears to work either way only because
# `python -m` puts the current directory on sys.path itself -- don't rely on
# that difference.
pythonpath = .

# Bare `pytest` collects only tests/, so it never walks data/fixtures/.
testpaths = tests
